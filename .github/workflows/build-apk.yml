name: Build APK

on:
  push:
    branches: [ main, ContinueBuilding ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_PERSISTENT_SIGNING_KEY: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # GitHub-hosted runners are ephemeral. Reuse one stable debug keystore so
      # subsequent debug APKs can update the installed app instead of conflicting.
      # Debug keys are for development APKs only; production releases need a dedicated
      # private release keystore managed separately.
      - name: Restore stable debug signing key
        if: ${{ env.HAS_PERSISTENT_SIGNING_KEY != 'true' }}
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: sigma-je-debug-keystore-v1-${{ runner.os }}

      # For stability across branch/merge boundaries, optionally provide the same
      # development keystore as a GitHub Actions secret. If unset, the cached
      # branch-local debug key remains in use.
      - name: Use persistent debug signing key when configured
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          else
            echo "No persistent keystore secret configured; using the cached debug keystore."
          fi

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      # Keep a short-lived Actions artifact for convenient run-level downloads.
      # The GitHub Release below is the durable download location.
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sigma-JE-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      # Publish only completed non-PR builds. Each run gets its own prerelease
      # and immutable tag, preserving a download/history entry for every build.
      - name: Publish APK to GitHub Releases
        if: ${{ success() && github.event_name != 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          APK_PATH: app/build/outputs/apk/debug/app-debug.apk
        run: |
          TAG="debug-build-${GITHUB_RUN_NUMBER}"
          TITLE="Sigma JE Debug Build #${GITHUB_RUN_NUMBER}"
          NOTES_FILE="$(mktemp)"

          {
            echo "Automated debug APK build."
            echo
            echo "- Branch: ${GITHUB_REF_NAME}"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "This is a development build, not a production-signed release."
          } > "$NOTES_FILE"

          gh release create "$TAG" "$APK_PATH" \
            --title "$TITLE" \
            --notes-file "$NOTES_FILE" \
            --prerelease \
            --target "$GITHUB_SHA"

          rm -f "$NOTES_FILE"

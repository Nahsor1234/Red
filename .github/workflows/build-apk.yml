name: Build APK

on:
  push:
    branches: [ main, ContinueBuilding ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # Release-producing builds must use the dedicated persistent key.
      # Fork pull requests do not receive repository secrets, so PR builds use
      # the runner-generated debug key and never publish a release.
      - name: Require permanent signing key
        if: ${{ github.event_name != 'pull_request' }}
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_DEBUG_KEYSTORE_BASE64 is required for release-producing builds."
            exit 1
          fi

          mkdir -p "$HOME/.android"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          test -s "$HOME/.android/debug.keystore"

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      # Verify every APK that can be published uses the expected permanent key.
      - name: Verify permanent APK signing certificate
        if: ${{ github.event_name != 'pull_request' }}
        env:
          EXPECTED_CERT_SHA256: "CE:52:86:9B:CA:EE:87:00:60:F4:4D:F1:25:E7:9F:60:79:E9:E6:7E:3A:69:FD:F1:EC:B9:26:B9:CD:38:1C:94"
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          "$APKSIGNER" verify --verbose --print-certs "$APK_PATH" | tee /tmp/apk-signing.txt
          ACTUAL_CERT_SHA256="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' /tmp/apk-signing.txt | tr '[:lower:]' '[:upper:]')"

          if [ "$ACTUAL_CERT_SHA256" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::APK signing certificate does not match the permanent Sigma JE key."
            echo "Expected: $EXPECTED_CERT_SHA256"
            echo "Actual:   $ACTUAL_CERT_SHA256"
            exit 1
          fi

          echo "APK signature verified against the permanent Sigma JE certificate."

      # Keep a short-lived Actions artifact for convenient run-level downloads.
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sigma-JE-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      # Publish only completed non-PR builds after certificate verification.
      - name: Publish APK to GitHub Releases
        if: ${{ success() && github.event_name != 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          APK_PATH: app/build/outputs/apk/debug/app-debug.apk
        run: |
          TAG="debug-build-${GITHUB_RUN_NUMBER}"
          TITLE="Sigma JE Debug Build #${GITHUB_RUN_NUMBER}"
          NOTES_FILE="$(mktemp)"

          {
            echo "Automated debug APK build."
            echo
            echo "- Branch: ${GITHUB_REF_NAME}"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "Signed with the permanent Sigma JE development key."
            echo "This is a development build, not a production-signed release."
          } > "$NOTES_FILE"

          gh release create "$TAG" "$APK_PATH" \
            --title "$TITLE" \
            --notes-file "$NOTES_FILE" \
            --prerelease \
            --target "$GITHUB_SHA"

          rm -f "$NOTES_FILE"

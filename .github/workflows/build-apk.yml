name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # GitHub-hosted runners are ephemeral. Reuse one stable debug keystore so
      # subsequent debug APKs can update the installed app instead of conflicting.
      # Debug keys are for development APKs only; production releases need a dedicated
      # private release keystore managed separately.
      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: sigma-je-debug-keystore-v1-${{ runner.os }}

      # For stability across branch/merge boundaries, optionally provide the same
      # development keystore as a GitHub Actions secret. If unset, the cached
      # branch-local debug key remains in use.
      - name: Use persistent debug signing key when configured
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          else
            echo "No persistent keystore secret configured; using the cached debug keystore."
          fi

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JEECommandCenter-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Verification build for the current implementation batch.
      # Current app identity/state verification build.

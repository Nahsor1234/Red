plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

// Base values live in gradle.properties; CI overrides them (-PversionCode / -PversionName) so
// every published build has a strictly increasing versionCode. Computed here, not inline in
// defaultConfig: `versionCode (x).toString()` would parse as `versionCode(x).toString()`.
def appVersionCode = ((project.findProperty('versionCode') ?: project.findProperty('APP_VERSION_CODE')) as String).toInteger()
def appVersionName = (project.findProperty('versionName') ?: project.findProperty('APP_VERSION_NAME')) as String

android {
    namespace 'com.example.jeecommandcenter'
    compileSdk 35

    defaultConfig {
        applicationId 'com.sigmaje.app'
        minSdk 23
        targetSdk 35
        versionCode appVersionCode
        versionName appVersionName

        def supabaseUrl = project.findProperty("SUPABASE_URL") ?: "https://clirtdxtqtiatuqkitmy.supabase.co"
        def supabaseKey = project.findProperty("SUPABASE_PUBLISHABLE_KEY") ?: "sb_publishable_VjQYGoJjFoAQXHSGwOohtQ_XL1XWIjU"
        buildConfigField "String", "SUPABASE_URL", "\"" + supabaseUrl + "\""
        buildConfigField "String", "SUPABASE_PUBLISHABLE_KEY", "\"" + supabaseKey + "\""
    }

    // Release signing is supplied by CI through environment variables (the keystore comes from a
    // GitHub Secret). Without them, e.g. on a developer machine, the release build is left unsigned.
    signingConfigs {
        release {
            def keystorePath = System.getenv('RELEASE_KEYSTORE_FILE')
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv('RELEASE_KEYSTORE_PASSWORD')
                keyAlias System.getenv('RELEASE_KEY_ALIAS')
                keyPassword System.getenv('RELEASE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            if (System.getenv('RELEASE_KEYSTORE_FILE')) {
                signingConfig signingConfigs.release
            }
        }
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

kotlin {
    jvmToolchain(17)
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    implementation platform('androidx.compose:compose-bom:2024.09.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    // Native LaTeX renderer; MIT licensed and does not embed a WebView.
    // AndroidMath's published metadata pulls in the legacy Android Support Library,
    // which conflicts with the AndroidX Core version used by this app.
    implementation('com.github.gregcockroft:AndroidMath:v1.0.0') {
        exclude group: 'com.android.support'
        // Guava 18 already contains ListenableFuture; remove the duplicate standalone class jar.
        exclude group: 'com.google.guava', module: 'listenablefuture'
    }

    debugImplementation 'androidx.compose.ui:ui-tooling'

    implementation 'io.github.jan-tennert.supabase:gotrue-kt:2.6.0'
    implementation 'io.github.jan-tennert.supabase:postgrest-kt:2.6.0'
    implementation 'io.ktor:ktor-client-android:2.3.12'
}


// Resolve the duplicate ListenableFuture class if the standalone artifact arrives transitively.
configurations.configureEach {
    exclude group: 'com.google.guava', module: 'listenablefuture'
}

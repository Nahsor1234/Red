plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

android {
    namespace 'com.example.jeecommandcenter'
    compileSdk 35

    defaultConfig {
        applicationId 'com.sigmaje.app'
        minSdk 23
        targetSdk 35
        versionCode 4
        versionName '2.2'

        def supabaseUrl = project.findProperty("SUPABASE_URL") ?: "https://clirtdxtqtiatuqkitmy.supabase.co"
        def supabaseKey = project.findProperty("SUPABASE_PUBLISHABLE_KEY") ?: "sb_publishable_VjQYGoJjFoAQXHSGwOohtQ_XL1XWIjU"
        buildConfigField "String", "SUPABASE_URL", "\"" + supabaseUrl + "\""
        buildConfigField "String", "SUPABASE_PUBLISHABLE_KEY", "\"" + supabaseKey + "\""
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

kotlin {
    jvmToolchain(17)
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    implementation platform('androidx.compose:compose-bom:2024.09.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    // Native LaTeX renderer; MIT licensed and does not embed a WebView.
    // AndroidMath's published metadata pulls in the legacy Android Support Library,
    // which conflicts with the AndroidX Core version used by this app.
    implementation('com.github.gregcockroft:AndroidMath:v1.0.0') {
        exclude group: 'com.android.support'
        // Guava 18 already contains ListenableFuture; remove the duplicate standalone class jar.
        exclude group: 'com.google.guava', module: 'listenablefuture'
    }

    // Resolve the duplicate class if listenablefuture enters through another transitive dependency.
    configurations.configureEach {
        exclude group: 'com.google.guava', module: 'listenablefuture'
    }
    debugImplementation 'androidx.compose.ui:ui-tooling'

    implementation 'com.google.android.material:material:1.12.0'

    implementation 'io.github.jan-tennert.supabase:gotrue-kt:2.6.0'
    implementation 'io.github.jan-tennert.supabase:postgrest-kt:2.6.0'
    implementation 'io.ktor:ktor-client-android:2.3.12'
}
